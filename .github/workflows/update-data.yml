name: Update Tourism Data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create data directory
        run: mkdir -p data

      - name: Download main CSV
        run: |
          curl -L -o data/hauptgliederung.csv \
            "https://data.vorarlberg.gv.at/katalog/wirtschaft/wirfin_vbg_tour_ankuenfte_naechtigungen_hauptgliederung_monatlich.csv"

      - name: Download countries CSV
        run: |
          curl -L -o data/staaten.csv \
            "https://data.vorarlberg.gv.at/katalog/wirtschaft/wirfin_vbg_tour_ankuenfte_naechtigungen_staaten_monatlich.csv"

      - name: Validate CSV files
        run: |
          for f in data/hauptgliederung.csv data/staaten.csv; do
            if grep -q '<!DOCTYPE\|<html' "$f" 2>/dev/null; then
              echo "ERROR: $f contains HTML instead of CSV"
              rm "$f"
              exit 1
            fi
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty"
              exit 1
            fi
          done
          echo "CSV files validated OK"

      - name: Append preview months from Land Vorarlberg Excel
        run: node scripts/update-preview.js
        continue-on-error: true

      - name: Update timestamp
        run: |
          echo "Letztes Update: $(date '+%Y-%m-%d %H:%M:%S UTC')" > data/last-update.txt

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --staged --quiet || git commit -m "Daten-Update $(date '+%Y-%m-%d %H:%M')"
          git push
